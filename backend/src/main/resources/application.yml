server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: diaea-parc-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:diaea_parc_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: 9a2f8c4e6b0d1e3f5a7c9b2d4e6f8a0b2c4d6e8f0a2b4c6d8e0f2a4b6c8d0e2f
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    com.diaea.parcinfo: INFO
    org.springframework.security: INFO
