version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: diaea_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: diaea_parc_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: diaea_user
      MYSQL_PASSWORD: diaea_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: diaea_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/diaea_parc_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: diaea_user
      SPRING_DATASOURCE_PASSWORD: diaea_password
    depends_on:
      mysql-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: diaea_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
